name: Test and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Backend and ETL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            etl/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt -r etl/requirements.txt
      - run: python -m compileall -q backend etl
      - run: python -m pytest -q backend/tests etl/tests
      - name: Run ETL sample and validate report
        run: |
          python etl/pipeline.py --input etl/sample_data/donations.csv --output-dir /tmp/food-etl-report
          python -m json.tool /tmp/food-etl-report/summary.json

  frontend:
    name: Frontend type check and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infrastructure:
    name: Validate infrastructure template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source for common AWS credential markers
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          markers = (
              re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          )
          ignored = {".git", ".venv", "node_modules", "dist", "__pycache__", "output"}
          extensions = {".py", ".ts", ".tsx", ".js", ".json", ".yml", ".yaml", ".toml", ".md"}
          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              if path.suffix not in extensions and not path.name.startswith(".env"):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if any(marker.search(content) for marker in markers):
                  findings.append(path.as_posix())
          if findings:
              print("Potential AWS credential markers found; values are intentionally withheld:")
              print("\n".join(sorted(findings)))
              sys.exit(1)
          print("No common AWS access-key or private-key markers found.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint template.yaml
      - name: Parse workflow YAML syntax
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          for workflow in Path(".github/workflows").glob("*.yml"):
              yaml.load(workflow.read_text(), Loader=yaml.BaseLoader)
              print(f"{workflow}: valid YAML")
          PY
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file template.yaml
