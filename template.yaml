AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Optional, low-scale teaching deployment for the Smart Food Redistribution API.

Parameters:
  ProjectName:
    Type: String
    Default: smart-food-demo
    MinLength: 3
    MaxLength: 30
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    Description: Lowercase project prefix used in resource names.
  StageName:
    Type: String
    Default: demo
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    Description: API Gateway stage name.
  CognitoDomainPrefix:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Globally unique Cognito managed-login domain prefix; deployment requires availability and cost review.
  SourceCommit:
    Type: String
    MinLength: 40
    MaxLength: 40
    AllowedPattern: "^[0-9a-f]{40}$"
    Description: Git commit used to prepare this reviewed change set.
  RuntimePermissionsBoundaryArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$"
    Description: Pre-created permissions boundary applied to both Lambda runtime roles.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: PassThrough

Resources:
  DonationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-donations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status_pk
          AttributeType: S
        - AttributeName: status_sk
          AttributeType: S
        - AttributeName: donor_pk
          AttributeType: S
        - AttributeName: donor_sk
          AttributeType: S
        - AttributeName: recipient_pk
          AttributeType: S
        - AttributeName: recipient_sk
          AttributeType: S
        - AttributeName: entity_pk
          AttributeType: S
        - AttributeName: entity_sk
          AttributeType: S
        - AttributeName: deadline_sk
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status_pk
              KeyType: HASH
            - AttributeName: status_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: donor-index
          KeySchema:
            - AttributeName: donor_pk
              KeyType: HASH
            - AttributeName: donor_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: recipient-index
          KeySchema:
            - AttributeName: recipient_pk
              KeyType: HASH
            - AttributeName: recipient_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: entity-index
          KeySchema:
            - AttributeName: entity_pk
              KeyType: HASH
            - AttributeName: entity_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: expiry-index
          KeySchema:
            - AttributeName: status_pk
              KeyType: HASH
            - AttributeName: deadline_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-spa"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - http://127.0.0.1:5173/auth/callback
        - http://localhost:5173/auth/callback
        - !Sub "https://${FrontendDistribution.DomainName}/auth/callback"
      LogoutURLs:
        - http://127.0.0.1:5173/
        - http://localhost:5173/
        - !Sub "https://${FrontendDistribution.DomainName}/"
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  DonorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: food-donors
      Description: Synthetic donor users; assign by an approved administrator.
      UserPoolId: !Ref CognitoUserPool

  NgoGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: food-ngos
      Description: Synthetic NGO users; assign by an approved administrator.
      UserPoolId: !Ref CognitoUserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: food-admins
      Description: Restricted synthetic project administrators.
      UserPoolId: !Ref CognitoUserPool

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "sharebite-${AWS::AccountId}-${AWS::Region}-analytics"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDemonstrationObjects
            Status: Enabled
            ExpirationInDays: 30

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "sharebite-${AWS::AccountId}-${AWS::Region}-frontend"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} HTTPS frontend"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: ShareBiteFrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ShareBiteFrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        IPV6Enabled: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  DonationsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
        DefaultAuthorizer: CognitoAuthorizer
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://127.0.0.1:5173
          - !Sub "https://${FrontendDistribution.DomainName}"
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - PATCH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      PermissionsBoundary: !Ref RuntimePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: donations-table-and-function-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AccessDonationsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DonationsTable.Arn
              - Sid: QueryDonationIndexes
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub "${DonationsTable.Arn}/index/*"
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-api:*"

  DonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      CodeUri: backend/
      Handler: aws_handler.handler
      Description: Validates demo donations and conditionally updates DynamoDB.
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DONATIONS_TABLE: !Ref DonationsTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref DonationsApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref DonationsApi
            Path: /api/{proxy+}
            Method: ANY

  DonationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  ETLExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-etl-role"
      PermissionsBoundary: !Ref RuntimePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: donations-read-analytics-write-and-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDonationRecords
                Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DonationsTable.Arn
              - Sid: WriteRunScopedReports
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${AnalyticsBucket.Arn}/etl/*"
              - Sid: WriteETLLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-etl:*"

  ETLFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-etl"
      CodeUri: etl/
      Handler: aws_handler.handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 1024
      Role: !GetAtt ETLExecutionRole.Arn
      Description: Reads bounded donation data, runs Pandas ETL, and writes private S3 reports.
      Environment:
        Variables:
          DONATIONS_TABLE: !Ref DonationsTable
          ANALYTICS_BUCKET: !Ref AnalyticsBucket

  ETLLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-etl"
      RetentionInDays: 7

Outputs:
  ApiBaseUrl:
    Description: HTTPS API base URL (no AWS deployment has been performed by this project).
    Value: !Sub "https://${DonationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}"
  FrontendUrl:
    Description: HTTPS frontend URL served by CloudFront from a private S3 origin.
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendDistributionId:
    Description: CloudFront distribution identifier for invalidation and verification.
    Value: !Ref FrontendDistribution
  FrontendBucketName:
    Description: Private S3 bucket containing the static frontend build.
    Value: !Ref FrontendBucket
  DonationsTableName:
    Description: DynamoDB table name.
    Value: !Ref DonationsTable
  AnalyticsBucketName:
    Description: Private S3 bucket for approved demonstration/ETL objects.
    Value: !Ref AnalyticsBucket
  LambdaFunctionName:
    Description: Donation API function name.
    Value: !Ref DonationsFunction
  ETLFunctionName:
    Description: Manually invoked Lambda that processes DynamoDB records and writes S3 reports.
    Value: !Ref ETLFunction
  LambdaExecutionRoleName:
    Description: Scoped Lambda execution role name.
    Value: !Ref LambdaExecutionRole
  CognitoUserPoolId:
    Description: Cognito user pool identifier.
    Value: !Ref CognitoUserPool
  CognitoAppClientId:
    Description: Public OAuth client identifier for the local SPA.
    Value: !Ref CognitoUserPoolClient
  CognitoIssuer:
    Description: JWT issuer configured on API Gateway.
    Value: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}"
  CognitoHostedUi:
    Description: Cognito managed-login host; domain prefix must be globally available.
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
